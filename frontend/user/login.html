<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | R-eadership</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/lp.css">
    <link rel="stylesheet" href="css/loading.css">
</head>
<body>
    <svg width="0" height="0" class="sprite" aria-hidden="true">
        <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    </svg>

    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand" aria-label="R-eadership トップへ">
                <span class="brand-mark"><img src="img/logo.png" alt="" width="30" height="34"></span>
                <span class="brand-text">
                    <span class="brand-name">R-eadership</span>
                    <span class="brand-sub">CAREER MANAGEMENT SYSTEM</span>
                </span>
            </a>
        </div>
    </header>

    <main class="soon-page">
        <!-- ログイン -->
        <section class="soon-card login-card pop-card" id="loginCard" hidden>
            <span class="section-badge bg-blue c-white">LOGIN</span>
            <h1>ログイン</h1>
            <p class="login-alert" id="loginAlert" role="alert" hidden></p>
            <form id="loginForm" novalidate>
                <label class="field">
                    <span>学校コード</span>
                    <input type="text" name="schoolCode" autocomplete="organization" autocapitalize="characters" spellcheck="false" maxlength="10" placeholder="例：DEMO">
                </label>
                <label class="field">
                    <span>教員ID</span>
                    <input type="text" name="teacherId" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20">
                </label>
                <div class="field">
                    <label for="loginPw"><span>パスワード</span></label>
                    <div class="pw-wrap">
                        <input type="password" id="loginPw" name="password" autocomplete="current-password" maxlength="64">
                        <button type="button" class="pw-toggle" id="pwToggle" aria-pressed="false" aria-controls="loginPw">表示</button>
                    </div>
                </div>
                <p class="form-msg" id="loginMsg" role="status" aria-live="polite"></p>
                <button type="submit" class="pop-btn btn-blue btn-block"><span>ログイン</span></button>
            </form>
            <p class="note-small login-help">パスワードを忘れたときは、学校の学校管理者にお問い合わせください。</p>
            <a href="index.html" class="back-link"><svg class="icon"><use href="#i-arrow-left"/></svg><span>トップページにもどる</span></a>
        </section>

        <!-- ログイン済み -->
        <section class="soon-card login-card pop-card" id="doneCard" hidden>
            <span class="section-badge bg-red c-white">WELCOME</span>
            <h1>ログインしました</h1>
            <dl class="done-list">
                <dt>学校</dt><dd id="doneSchool"></dd>
                <dt>名前</dt><dd id="doneName"></dd>
                <dt>権限</dt><dd id="doneRole"></dd>
            </dl>
            <p>ダッシュボードは、ただいま準備中です。</p>
            <button type="button" class="pop-btn btn-white btn-block" id="logoutBtn"><span>ログアウト</span></button>
        </section>
    </main>

    <script src="js/loading.js"></script>
    <script src="js/schools.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
